<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABAS Estimator</title>
<meta name="description" content="Building automation project cost estimator — labor, materials, sub-labor, misc, final estimate, and progress billing.">
<meta name="theme-color" content="#1E4E8C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ABAS Estimator">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#ECEFF2;
  --panel:#FFFFFF;
  --panel-alt:#F4F6F8;
  --ink:#1A2330;
  --ink-soft:#5B6B7D;
  --ink-faint:#8996A3;
  --border:#D3D9DF;
  --border-strong:#AEB8C2;
  --blue:#1E4E8C;
  --blue-dark:#163B6C;
  --blue-pale:#E7EEF7;
  --amber:#C97A1A;
  --amber-pale:#FBF0DF;
  --teal:#1F7A6C;
  --teal-pale:#E4F2EF;
  --red:#B23A2E;
  --red-pale:#FAE7E4;
  --radius:3px;
  --font-ui:'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
  --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161C;
    --panel:#1A2028;
    --panel-alt:#1F2630;
    --ink:#E7EBEF;
    --ink-soft:#A7B2BE;
    --ink-faint:#6E7A87;
    --border:#2C333D;
    --border-strong:#3B4550;
    --blue:#5C93D6;
    --blue-dark:#7FAEE8;
    --blue-pale:#1C2A3B;
    --amber:#E3A54B;
    --amber-pale:#33291A;
    --teal:#4FB3A0;
    --teal-pale:#172B27;
    --red:#E07566;
    --red-pale:#331E1C;
  }
}
:root[data-theme="dark"]{
  --bg:#12161C;--panel:#1A2028;--panel-alt:#1F2630;--ink:#E7EBEF;--ink-soft:#A7B2BE;
  --ink-faint:#6E7A87;--border:#2C333D;--border-strong:#3B4550;--blue:#5C93D6;--blue-dark:#7FAEE8;
  --blue-pale:#1C2A3B;--amber:#E3A54B;--amber-pale:#33291A;--teal:#4FB3A0;--teal-pale:#172B27;
  --red:#E07566;--red-pale:#331E1C;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#app{max-width:1180px;margin:0 auto;padding:0 20px 60px;}

.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:16px 0 10px;border-bottom:2px solid var(--ink);margin-bottom:6px;
}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;}
.brand .mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;background:var(--blue);color:#fff;
  font-family:var(--font-mono);font-weight:600;font-size:15px;flex:none;
}
.brand h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px;}
.brand .tagline{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-mono);}

.topbar-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

select, .btn, .icon-btn{
  border:1px solid var(--border-strong);
  background:var(--panel);
  color:var(--ink);
  padding:7px 11px;
  border-radius:var(--radius);
  cursor:pointer;
  font-size:12.5px;
  font-weight:500;
}
select{padding:7px 8px;max-width:190px;}
.btn:hover, .icon-btn:hover, select:hover{border-color:var(--blue);}
.btn:active, .icon-btn:active{transform:translateY(1px);}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);}
.btn-danger{color:var(--red);}
.btn-danger:hover{border-color:var(--red);}
.btn[disabled]{opacity:.4;cursor:not-allowed;}

.project-row{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:4px;
}
.project-name-input{
  font-size:16px;font-weight:600;border:1px solid transparent;background:transparent;
  padding:4px 6px;border-radius:var(--radius);min-width:160px;flex:1 1 220px;
}
.project-name-input:hover{border-color:var(--border);}
.project-name-input:focus{border-color:var(--blue);outline:none;background:var(--panel);}

.save-status{
  font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.save-status .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);}
.save-status.saved .dot{background:var(--teal);}
.save-status.saving .dot{background:var(--amber);}

/* summary strip */
.summary-strip{
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
  background:var(--border);border:1px solid var(--border);margin:14px 0 18px;
}
.summary-cell{background:var(--panel);padding:10px 14px;}
.summary-cell .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:3px;}
.summary-cell .value{font-family:var(--font-mono);font-size:16px;font-weight:600;}
.summary-cell.total{background:var(--blue);}
.summary-cell.total .label{color:#CFE0F5;}
.summary-cell.total .value{color:#fff;}

/* tabs — panel-selector style */
.tabs{display:flex;flex-wrap:wrap;border:1px solid var(--border-strong);background:var(--panel-alt);}
.tab-btn{
  flex:1 1 auto;text-align:center;padding:11px 10px;border:none;background:transparent;
  color:var(--ink-soft);font-weight:600;font-size:12.5px;letter-spacing:.02em;
  border-right:1px solid var(--border);cursor:pointer;position:relative;
}
.tab-btn:last-child{border-right:none;}
.tab-btn .n{font-family:var(--font-mono);color:var(--ink-faint);margin-right:6px;}
.tab-btn:hover{background:var(--panel);color:var(--ink);}
.tab-btn.active{background:var(--panel);color:var(--blue);}
.tab-btn.active::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--blue);
}

.tab-panel{background:var(--panel);border:1px solid var(--border-strong);border-top:none;padding:20px;}
.tab-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.tab-header h2{font-size:14px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);}
.tab-header .hint{font-size:11.5px;color:var(--ink-faint);}

/* meta fields (final estimate tab) */
.meta-grid{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;margin-bottom:20px;max-width:640px;}
.meta-grid label{font-size:11.5px;color:var(--ink-soft);align-self:center;text-transform:uppercase;letter-spacing:.04em;}
.meta-grid input, .meta-grid textarea{
  border:1px solid var(--border);background:var(--panel-alt);padding:7px 9px;border-radius:var(--radius);width:100%;
}
.meta-grid textarea{resize:vertical;min-height:38px;}
.meta-grid input:focus, .meta-grid textarea:focus{outline:none;border-color:var(--blue);background:var(--panel);}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);}
table.line-table{border-collapse:collapse;width:100%;min-width:640px;}
table.line-table th, table.line-table td{border-bottom:1px solid var(--border);padding:0;}
table.line-table thead th{
  background:var(--blue);color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  text-align:left;padding:8px 10px;font-weight:600;border-bottom:none;white-space:nowrap;
}
table.line-table tbody tr:nth-child(even){background:var(--panel-alt);}
table.line-table tbody tr:hover{background:var(--blue-pale);}
table.line-table td{padding:0;}
table.line-table td input{
  width:100%;border:none;background:transparent;padding:8px 10px;color:var(--ink);
}
table.line-table td input:focus{outline:2px solid var(--blue);outline-offset:-2px;background:var(--panel);}
table.line-table .col-item{width:44px;text-align:center;color:var(--ink-faint);padding:8px 4px;}
table.line-table .col-total{width:120px;text-align:right;font-weight:600;padding:8px 10px;white-space:nowrap;}
table.line-table .col-actions{width:36px;text-align:center;}
table.line-table input[type=number]{text-align:right;font-family:var(--font-mono);}
.mono{font-family:var(--font-mono);}
.row-del{
  border:none;background:transparent;color:var(--ink-faint);cursor:pointer;font-size:13px;
  width:26px;height:26px;border-radius:var(--radius);
}
.row-del:hover{color:var(--red);background:var(--red-pale);}
table.line-table tfoot td{
  padding:10px;font-weight:700;background:var(--ink);color:#fff;border-bottom:none;
}
table.line-table tfoot .total-label{text-align:right;text-transform:uppercase;font-size:11px;letter-spacing:.05em;}
table.line-table tfoot .total-value{text-align:right;font-family:var(--font-mono);font-size:14px;color:var(--amber-pale);}
table.line-table tfoot .total-value{color:#F4C57C;}

.table-toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap;}

/* final estimate table */
table.final-table{border-collapse:collapse;width:100%;max-width:760px;}
table.final-table th{
  background:var(--ink);color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  text-align:right;padding:8px 10px;font-weight:600;
}
table.final-table th:first-child{text-align:left;}
table.final-table td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;}
table.final-table td:first-child{text-align:left;font-weight:600;color:var(--ink);}
table.final-table tr:nth-child(even){background:var(--panel-alt);}
table.final-table input{
  width:70px;border:1px solid var(--border);background:var(--panel);padding:5px 6px;border-radius:var(--radius);
  text-align:right;font-family:var(--font-mono);
}
table.final-table input:focus{outline:none;border-color:var(--blue);}
table.final-table .mono{font-family:var(--font-mono);}
.final-total-row td{font-weight:700;font-size:15px;background:var(--blue)!important;color:#fff;}
.final-total-row td:first-child{color:#fff;}
.final-sub-row td{background:var(--amber-pale)!important;font-weight:600;}

/* billing */
.billing-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:20px;}
.billing-summary .cell{background:var(--panel);padding:10px 12px;}
.billing-summary .cell label{display:block;font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.billing-summary .cell input{
  width:100%;border:1px solid var(--border);background:var(--panel-alt);padding:6px 8px;border-radius:var(--radius);
  font-family:var(--font-mono);text-align:right;
}
.billing-summary .cell .readout{font-family:var(--font-mono);font-size:15px;font-weight:600;}
.billing-summary .cell .remaining{font-size:11px;color:var(--ink-faint);margin-top:2px;}

table.billing-table{border-collapse:collapse;width:100%;min-width:1080px;font-size:12px;}
table.billing-table th{background:var(--ink);color:#fff;padding:7px 8px;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;text-align:right;font-weight:600;}
table.billing-table th:nth-child(-n+3){text-align:left;}
table.billing-table td{border-bottom:1px solid var(--border);padding:0;text-align:right;white-space:nowrap;}
table.billing-table td:nth-child(-n+3){text-align:left;}
table.billing-table tbody tr:nth-child(even){background:var(--panel-alt);}
table.billing-table input{width:78px;border:none;background:transparent;padding:7px 8px;text-align:right;font-family:var(--font-mono);}
table.billing-table input[type=date]{width:118px;}
table.billing-table input[type=text]{width:70px;text-align:left;}
table.billing-table input:focus{outline:2px solid var(--blue);outline-offset:-2px;background:var(--panel);}
table.billing-table tfoot td{background:var(--ink);color:#fff;font-weight:700;padding:8px;font-family:var(--font-mono);}

.empty-state{padding:40px 20px;text-align:center;color:var(--ink-faint);}
.empty-state p{margin:0 0 14px;}

footer.app-footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--border);color:var(--ink-faint);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
footer.app-footer a{color:var(--ink-soft);}

/* print */
@media print{
  body{background:#fff;}
  .topbar,.tabs,.table-toolbar,.row-del,.icon-btn,.save-status,footer.app-footer,.no-print{display:none!important;}
  #app{max-width:100%;padding:0;}
  .tab-panel{border:none;padding:0;}
  table.line-table input, table.final-table input, table.billing-table input, .meta-grid input, .meta-grid textarea{
    border:none!important;background:transparent!important;
  }
}

/* printable output: internal report (landscape) and client proposal (portrait), built by JS right before printing */
#printReport{display:none;}
@page{margin:12mm;}
@page rptpage{size:letter landscape;margin:12mm;}
@page proposal{size:letter portrait;margin:16mm;}
.rpt{page:rptpage;}
.prop{page:proposal;}
@media print{
  #app{display:none!important;}
  #printReport{display:block;color:#000;font-family:var(--font-ui);}
  #printReport .rpt h1{font-size:18px;margin:0 0 6px;}
  #printReport .rpt h2{font-size:13px;margin:16px 0 6px;padding-bottom:3px;border-bottom:1px solid #000;break-after:avoid;}
  #printReport .rpt table{border-collapse:collapse;width:100%;font-size:10px;}
  #printReport .rpt tr{break-inside:avoid;}
  #printReport .rpt th{background:#1E4E8C;color:#fff;text-align:left;padding:3px 6px;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #printReport .rpt td{padding:3px 6px;border-bottom:1px solid #ccc;}
  #printReport .rpt td.num{text-align:right;}
  #printReport .rpt .b{font-weight:700;}
  #printReport .rpt td.sp{border-bottom:none;padding:4px;}
  #printReport .internal-banner{border:2px solid #B23A2E;color:#B23A2E;font-weight:700;text-align:center;padding:4px 8px;margin-bottom:10px;font-size:11px;}
}

/* client proposal: used by both the on-screen preview and the printout */
.prop{background:#fff;color:#111;font-family:var(--font-ui);font-size:12px;line-height:1.5;}
.prop-screen{background:#fff;border:1px solid var(--border-strong);box-shadow:0 1px 4px rgba(0,0,0,.15);padding:28px 32px;max-width:800px;margin:8px auto 0;overflow-x:auto;}
.prop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:3px solid #1E4E8C;padding-bottom:10px;margin-bottom:14px;}
.prop-co{font-size:19px;font-weight:700;color:#1E4E8C;}
.prop-sub{color:#444;white-space:pre-line;}
.prop-title{text-align:right;white-space:nowrap;}
.prop-h{font-size:22px;font-weight:700;letter-spacing:.12em;color:#1E4E8C;}
.prop-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin-bottom:6px;}
.prop-meta span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#666;}
.prop-meta b{font-weight:600;}
.prop h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#1E4E8C;margin:18px 0 6px;padding-bottom:3px;border-bottom:1px solid #bbb;break-after:avoid;}
.prop .pre{white-space:pre-wrap;margin:0;}
.prop table{width:100%;border-collapse:collapse;}
.prop th{background:#1E4E8C;color:#fff;text-align:left;padding:5px 8px;font-size:11px;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.prop th.a,.prop td.a,.prop td.q{text-align:right;}
.prop td.q{white-space:nowrap;}
.prop td{padding:5px 8px;border-bottom:1px solid #ddd;vertical-align:top;}
.prop tr{break-inside:avoid;}
.prop tr.grp td{background:#eef2f7;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.prop tr.sub td{font-weight:600;}
.prop tr.tot td{font-weight:700;font-size:13px;border-top:2px solid #111;border-bottom:none;}
.prop .sigs{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:22px;break-inside:avoid;}
.prop .sig-line{border-bottom:1px solid #111;height:30px;margin-bottom:3px;}
.prop .sig-lab{font-size:10px;color:#555;margin-bottom:10px;}

/* proposal editor + tax column */
.meta-grid.wide{max-width:780px;grid-template-columns:150px 1fr;}
.meta-grid.wide label{align-self:start;padding-top:8px;}
.meta-grid select{max-width:260px;width:100%;}
.hint-row{grid-column:1 / -1;font-size:11.5px;color:var(--ink-faint);margin:-2px 0 6px;}
.preview-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:20px 0 4px;}
table.final-table{max-width:860px;}
table.final-table th.chk,table.final-table td.chk{text-align:center;}
table.final-table td.chk input{width:auto;}

@media (max-width:720px){
  .summary-strip{grid-template-columns:repeat(2,1fr);}
  table.line-table{min-width:560px;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printReport"></div>

<script>
(function(){
"use strict";

/* ============================================================
   CONFIG — mirrors the original workbook's sheet logic
   ============================================================ */
var STORAGE_KEY = "abas_estimator_projects_v1";
var ACTIVE_KEY = "abas_estimator_active_v1";

var LINE_CONFIG = {
  labor: {
    label: "Labor & Scope", short: "Labor",
    columns: [
      {key:"scope", label:"Scope of Work", type:"text", placeholder:"e.g. Programming — AHU-1 sequence"},
      {key:"hours", label:"Hours", type:"number", step:"0.25"},
      {key:"rate", label:"Hourly Rate", type:"currency", step:"1"}
    ],
    computeTotal: function(r){ return (parseFloat(r.hours)||0) * (parseFloat(r.rate)||0); },
    totalLabel: "Labor Cost",
    seed: [
      {scope:"PM Time", hours:"", rate:""},
      {scope:"Engineering Time", hours:"", rate:""},
      {scope:"Training Time", hours:"", rate:""}
    ]
  },
  subLabor: {
    label: "Sub-Labor", short: "Sub-Labor",
    columns: [
      {key:"scope", label:"Scope of Work", type:"text", placeholder:"e.g. Electrical sub — conduit run"},
      {key:"hours", label:"Hours", type:"number", step:"0.25"},
      {key:"rate", label:"Hourly Rate", type:"currency", step:"1"}
    ],
    computeTotal: function(r){ return (parseFloat(r.hours)||0) * (parseFloat(r.rate)||0); },
    totalLabel: "Sub-Labor Cost",
    seed: [ {scope:"", hours:"", rate:""} ]
  },
  materials: {
    label: "Materials", short: "Materials",
    columns: [
      {key:"desc", label:"Description", type:"text", placeholder:"e.g. Distech ECB-203"},
      {key:"partNumber", label:"Part Number", type:"text"},
      {key:"vendor", label:"Vendor", type:"text"},
      {key:"qty", label:"Qty", type:"number", step:"1"},
      {key:"unitCost", label:"Unit Cost", type:"currency", step:"0.01"}
    ],
    computeTotal: function(r){ return (parseFloat(r.qty)||0) * (parseFloat(r.unitCost)||0); },
    totalLabel: "Total Material Cost",
    seed: [ {desc:"", partNumber:"", vendor:"", qty:"", unitCost:""} ]
  },
  misc: {
    label: "Misc", short: "Misc",
    columns: [
      {key:"desc", label:"Description", type:"text", placeholder:"e.g. Permit fee"},
      {key:"partNumber", label:"Part Number", type:"text"},
      {key:"vendor", label:"Vendor", type:"text"},
      {key:"qty", label:"Qty", type:"number", step:"1"},
      {key:"unitCost", label:"Unit Cost", type:"currency", step:"0.01"}
    ],
    computeTotal: function(r){ return (parseFloat(r.qty)||0) * (parseFloat(r.unitCost)||0); },
    totalLabel: "Total Misc. Cost",
    seed: [ {desc:"", partNumber:"", vendor:"", qty:"", unitCost:""} ]
  }
};

var TAB_ORDER = ["labor","materials","subLabor","misc","final","proposal","billing"];
var TAB_LABELS = {labor:"Labor & Scope", materials:"Materials", subLabor:"Sub-Labor", misc:"Misc", final:"Final Estimate", proposal:"Proposal", billing:"Billing"};

/* ============================================================
   UTILITIES
   ============================================================ */
function uid(){ return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function fmtCurrency(n){
  n = isFinite(n) ? n : 0;
  return n.toLocaleString('en-US', {style:'currency', currency:'USD'});
}
function fmtNum(n, d){
  n = isFinite(n) ? n : 0;
  return n.toLocaleString('en-US', {minimumFractionDigits:d||0, maximumFractionDigits:d||2});
}
function esc(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function debounce(fn, ms){
  var t;
  return function(){
    var args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(ctx, args); }, ms);
  };
}

   ============================================================ */
function makeRow(cols){
  var r = {};
  cols.forEach(function(c){ r[c.key] = ""; });
  return r;
}
function makeDefaultData(){
  var data = {};
  Object.keys(LINE_CONFIG).forEach(function(key){
    var cfg = LINE_CONFIG[key];
    data[key] = (cfg.seed || [makeRow(cfg.columns)]).map(function(seedRow){
      var r = makeRow(cfg.columns);
      Object.keys(seedRow).forEach(function(k){ r[k] = seedRow[k]; });
      return r;
    });
  });
  data.meta = { client:"", date:"", scope:"" };
  data.final = {
    marginLabor: 35, marginMaterial: 35, marginSubLabor: 35, marginMisc: 35,
    warrantyPct: 5, tripCharge: 0, freightCost: 0, taxPct: 8.25,
    taxable: defaultTaxable()
  };
  data.billing = {
    retainagePct: 10,
    contractLabor: null, contractMaterials: null, contractSubContr: null, contractMisc: null,
    changeOrderAmount: 0,
    cycles: [ makeCycleRow() ]
  };
  data.proposal = defaultProposal();
  return data;
}
function makeCycleRow(){

/* ============================================================
   DERIVED CALCULATIONS
   ============================================================ */
function computeDerived(data){
  var laborTotal = data.labor.reduce(function(s,r){ return s + LINE_CONFIG.labor.computeTotal(r); }, 0);
  var materialTotal = data.materials.reduce(function(s,r){ return s + LINE_CONFIG.materials.computeTotal(r); }, 0);
  var subLaborTotal = data.subLabor.reduce(function(s,r){ return s + LINE_CONFIG.subLabor.computeTotal(r); }, 0);
  var miscTotal = data.misc.reduce(function(s,r){ return s + LINE_CONFIG.misc.computeTotal(r); }, 0);

  var f = data.final;
  function marginRow(cost, marginPct){
    var m = (parseFloat(marginPct)||0)/100;
    var marginDollars = m >= 1 ? 0 : cost / (1 - m) - cost;
    var costPlusMargin = cost + marginDollars;
    return {cost:cost, marginDollars:marginDollars, costPlusMargin:costPlusMargin};
  }
  var rowLabor = marginRow(laborTotal, f.marginLabor);
  var rowMaterial = marginRow(materialTotal, f.marginMaterial);
  var rowSubLabor = marginRow(subLaborTotal, f.marginSubLabor);
  var rowMisc = marginRow(miscTotal, f.marginMisc);

  var sumCost = rowLabor.cost + rowMaterial.cost + rowSubLabor.cost + rowMisc.cost;
  var sumMargin = rowLabor.marginDollars + rowMaterial.marginDollars + rowSubLabor.marginDollars + rowMisc.marginDollars;
  var sumCostPlusMargin = rowLabor.costPlusMargin + rowMaterial.costPlusMargin + rowSubLabor.costPlusMargin + rowMisc.costPlusMargin;

  var warrantyAmt = (parseFloat(f.warrantyPct)||0)/100 * sumCostPlusMargin;
  var tripCharge = parseFloat(f.tripCharge)||0;
  var freightCost = parseFloat(f.freightCost)||0;
  var subtotalCost = sumCostPlusMargin + warrantyAmt + tripCharge + freightCost;
  var tx = f.taxable || {};
  function isTaxable(k){ return tx[k] !== false; }
  var taxableBase =
    (isTaxable('labor') ? rowLabor.costPlusMargin : 0) +
    (isTaxable('material') ? rowMaterial.costPlusMargin : 0) +
    (isTaxable('subLabor') ? rowSubLabor.costPlusMargin : 0) +
    (isTaxable('misc') ? rowMisc.costPlusMargin : 0) +
    (isTaxable('warranty') ? warrantyAmt : 0) +
    (isTaxable('trip') ? tripCharge : 0) +
    (isTaxable('freight') ? freightCost : 0);
  var taxAmt = (parseFloat(f.taxPct)||0)/100 * taxableBase;
  var totalCost = subtotalCost + taxAmt;

  var finalCalc = {
    labor: rowLabor, material: rowMaterial, subLabor: rowSubLabor, misc: rowMisc,
    sumCost: sumCost, sumMargin: sumMargin, sumCostPlusMargin: sumCostPlusMargin,
    warrantyAmt: warrantyAmt, tripCharge: tripCharge, freightCost: freightCost,
    subtotalCost: subtotalCost, taxableBase: taxableBase, taxAmt: taxAmt, totalCost: totalCost
  };

  var b = data.billing;
  var contractLabor = b.contractLabor !== null && b.contractLabor !== "" && b.contractLabor !== undefined ? parseFloat(b.contractLabor)||0 : rowLabor.costPlusMargin;
  var contractMaterials = b.contractMaterials !== null && b.contractMaterials !== "" && b.contractMaterials !== undefined ? parseFloat(b.contractMaterials)||0 : rowMaterial.costPlusMargin;
  var contractSubContr = b.contractSubContr !== null && b.contractSubContr !== "" && b.contractSubContr !== undefined ? parseFloat(b.contractSubContr)||0 : rowSubLabor.costPlusMargin;
  var contractMisc = b.contractMisc !== null && b.contractMisc !== "" && b.contractMisc !== undefined ? parseFloat(b.contractMisc)||0 : (rowMisc.costPlusMargin + warrantyAmt);
  var contractSubTotal = contractLabor + contractMaterials + contractSubContr + contractMisc;
  var changeOrderAmount = parseFloat(b.changeOrderAmount)||0;
  var totalContract = contractSubTotal + changeOrderAmount;
  var retainagePct = (parseFloat(b.retainagePct)||0)/100;

  var cycles = (b.cycles||[]).map(function(c){
    var laborAmt = (parseFloat(c.laborPct)||0)/100 * contractLabor;
    var materialsAmt = (parseFloat(c.materialsPct)||0)/100 * contractMaterials;
    var subContrAmt = (parseFloat(c.subContrPct)||0)/100 * contractSubContr;
    var miscAmt = (parseFloat(c.miscPct)||0)/100 * contractMisc;
    var changeAmt = (parseFloat(c.changeOrderPct)||0)/100 * changeOrderAmount;
    var subTotalAmt = laborAmt + materialsAmt + subContrAmt + miscAmt + changeAmt;
    var retainageAmt = subTotalAmt * retainagePct;
    var totalAmt = subTotalAmt - retainageAmt;
    return {laborAmt:laborAmt, materialsAmt:materialsAmt, subContrAmt:subContrAmt, miscAmt:miscAmt, changeAmt:changeAmt, subTotalAmt:subTotalAmt, retainageAmt:retainageAmt, totalAmt:totalAmt};
  });
  var running = 0;
  cycles.forEach(function(c){ running += c.totalAmt; c.runningTotal = running; });

  var billedLabor=0, billedMaterials=0, billedSubContr=0, billedMisc=0, billedChange=0, billedSub=0, billedRetain=0, billedTotal=0;
  cycles.forEach(function(c){
    billedLabor+=c.laborAmt; billedMaterials+=c.materialsAmt; billedSubContr+=c.subContrAmt;
    billedMisc+=c.miscAmt; billedChange+=c.changeAmt; billedSub+=c.subTotalAmt; billedRetain+=c.retainageAmt; billedTotal+=c.totalAmt;
  });

  var billingCalc = {
    contractLabor:contractLabor, contractMaterials:contractMaterials, contractSubContr:contractSubContr, contractMisc:contractMisc,
    contractSubTotal:contractSubTotal, changeOrderAmount:changeOrderAmount, totalContract:totalContract,
    remainingLabor: contractLabor - billedLabor, remainingMaterials: contractMaterials - billedMaterials,
    remainingSubContr: contractSubContr - billedSubContr, remainingMisc: contractMisc - billedMisc,
    remainingSubTotal: contractSubTotal - billedSub, remainingChange: changeOrderAmount - billedChange,
    remainingTotal: totalContract - billedTotal, retainageBilled: billedRetain,
    cycles: cycles
  };

  return {
    laborTotal: laborTotal, materialTotal: materialTotal, subLaborTotal: subLaborTotal, miscTotal: miscTotal,
    final: finalCalc, billing: billingCalc
  };
}

/* ============================================================
   EVENTS
   ============================================================ */
function wireGlobalEvents(){
  var app = document.getElementById('app');

  /* #app persists across renders, so these must only be attached once */
  if (!app.__wired){
    app.__wired = true;
    app.addEventListener('input', onInput);
    app.addEventListener('click', onClick);
    app.addEventListener('change', function(e){
      if (e.target.id === 'projectSelect') switchProject(e.target.value);
      if (e.target.id === 'importFile') handleImportFile(e.target.files[0]);
      if (e.target.id === 'exportSelect'){ var kind = e.target.value; e.target.value = ''; runExport(kind); }
    });
  }

  var nameInput = document.getElementById('projectNameInput');
  if (nameInput){
    nameInput.addEventListener('input', function(e){
      current.name = e.target.value;
      markDirty();
      var opt = document.querySelector('#projectSelect option[value="'+current.id+'"]');
      if (opt) opt.textContent = current.name || 'Untitled Estimate';
    });
  }
}

function onInput(e){
  var t = e.target;
  var role = t.dataset.role;
  if (!role) return;

  if (role === 'line-field'){
    var section = t.dataset.section, idx = parseInt(t.dataset.idx,10), key = t.dataset.key, type = t.dataset.type;
    var val = type === 'number' ? t.value : t.value;
    current.data[section][idx][key] = val;
    updateLineRow(section, idx);
    markDirty();
  } else if (role === 'meta-field'){
    current.data.meta[t.dataset.key] = t.value;
    if (activeTab === 'proposal') refreshProposalPreview();
    markDirty();
  } else if (role === 'proposal-field'){
    current.data.proposal[t.dataset.key] = t.value;
    refreshProposalPreview();
    markDirty();
  } else if (role === 'company-field'){
    company[t.dataset.key] = t.value;
    saveCompany();
    refreshProposalPreview();
  } else if (role === 'tax-field'){
    if (!current.data.final.taxable) current.data.final.taxable = defaultTaxable();
    current.data.final.taxable[t.dataset.key] = t.checked;
    refreshFinalTab();
    refreshSummaryStrip();
    markDirty();
  } else if (role === 'final-field'){
    current.data.final[t.dataset.key] = t.value;
    refreshFinalTab();
    refreshSummaryStrip();
    markDirty();
  } else if (role === 'billing-field'){
    var bkey = t.dataset.key;
    current.data.billing[bkey] = t.value === '' ? (bkey.indexOf('contract')===0 ? null : 0) : t.value;
    refreshBillingTab();
    markDirty();
  } else if (role === 'cycle-field'){
    var cidx = parseInt(t.dataset.idx,10);
    current.data.billing.cycles[cidx][t.dataset.key] = t.value;
    refreshBillingTab();
    markDirty();
  }
}

function onClick(e){
  var btn = e.target.closest('[data-action]');
  if (!btn) return;
  var action = btn.dataset.action;

  if (action === 'tab'){
    activeTab = btn.dataset.tab;
    render();
    return;
  }
  if (action === 'add-row'){
    var section = btn.dataset.section;
    current.data[section].push(makeRow(LINE_CONFIG[section].columns));
    markDirty();
    render();
    return;
  }
  if (action === 'del-row'){
    var s = btn.dataset.section, i = parseInt(btn.dataset.idx,10);
    if (current.data[s].length <= 1){
      current.data[s][i] = makeRow(LINE_CONFIG[s].columns);
    } else {
      current.data[s].splice(i,1);
    }
    markDirty();
    render();
    return;
  }
  if (action === 'add-cycle'){
    current.data.billing.cycles.push(makeCycleRow());
    markDirty();
    render();
    return;
  }
  if (action === 'del-cycle'){
    var ci = parseInt(btn.dataset.idx,10);
    if (current.data.billing.cycles.length <= 1){
      current.data.billing.cycles[ci] = makeCycleRow();
    } else {
      current.data.billing.cycles.splice(ci,1);
    }
    markDirty();
    render();
    return;
  }
  if (action === 'new-project'){
    var name = prompt('Name for the new estimate:', 'New Estimate');
    if (name === null) return;
    var p = makeProject(name || 'Untitled Estimate');
    projects.push(p);
    current = p;
    setActiveId(p.id);
    saveAllProjects(projects);
    activeTab = 'labor';
    render();
    return;
  }
  if (action === 'clear-inputs'){
    if (!confirm('Clear everything you entered in "' + current.name + '"?\n\nDefault labels and percentages are kept. This cannot be undone, so use Export > JSON backup first if you may need it.')) return;
    current.data = makeDefaultData();
    current.updatedAt = Date.now();
    saveAllProjects(projects);
    render();
    return;
  }
  if (action === 'duplicate-project'){
    var copy = JSON.parse(JSON.stringify(current));
    copy.id = uid();
    copy.name = current.name + ' (copy)';
    copy.updatedAt = Date.now();
    projects.push(copy);
    current = copy;
    setActiveId(copy.id);
    saveAllProjects(projects);
    render();
    return;
  }
  if (action === 'delete-project'){
    if (projects.length <= 1) return;
    if (!confirm('Delete "'+current.name+'"? This cannot be undone.')) return;
    projects = projects.filter(function(p){ return p.id !== current.id; });
    saveAllProjects(projects);
    current = projects[0];
    setActiveId(current.id);
    render();
    return;
  }
  if (action === 'export-json'){
    exportProjectJSON();
    return;
  }
  if (action === 'import-json'){
    document.getElementById('importFile').click();
    return;
  }
  if (action === 'print-proposal'){
    runExport('proposal');
    return;
  }
  if (action === 'print'){
    window.print();
    return;
  }
  if (action === 'install'){
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(function(){
      deferredInstallPrompt = null;
      installPromptAvailable = false;
      var b = document.getElementById('installBtn');
      if (b) b.style.display = 'none';
    });
    return;
  }
  if (action === 'export-csv'){
    exportCSV(btn.dataset.section);
    return;
  }
}

function switchProject(id){
  var p = projects.find(function(p){ return p.id === id; });
  if (!p) return;
  current = p;
  setActiveId(id);
  activeTab = 'labor';
  render();
}

/* ============================================================
   EXPORT / IMPORT
   ============================================================ */
function downloadBlob(filename, content, mime){
  var blob = new Blob([content], {type: mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function safeFileName(s){ return (s||'estimate').replace(/[^a-z0-9\-_]+/gi,'_').slice(0,60); }

function exportProjectJSON(){
  downloadBlob(safeFileName(current.name)+'.json', JSON.stringify(current, null, 2), 'application/json');
}

function handleImportFile(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var obj = JSON.parse(reader.result);
      if (!obj || !obj.data) throw new Error('Not a valid estimate file');
      migrateData(obj.data);
      obj.id = uid();
      obj.name = (obj.name || 'Imported Estimate') + ' (imported)';
      obj.updatedAt = Date.now();
      projects.push(obj);
      current = obj;
      setActiveId(obj.id);
      saveAllProjects(projects);
      activeTab = 'labor';
      render();
    }catch(err){
      alert('Could not import that file: ' + err.message);
    }
  };
  reader.readAsText(file);
}

/* ---- shared sheet model: one source of truth for Excel, CSV and print ---- */
function numOrNull(x){ var n = parseFloat(x); return isFinite(n) ? n : null; }
function rowHasContent(r, cols){
  return cols.some(function(c){ return String(r[c.key] === undefined || r[c.key] === null ? '' : r[c.key]).trim() !== ''; });
}
function cellNorm(c){
  if (c && typeof c === 'object') return {v: c.v, s: c.s || ''};
  return {v: c, s: ''};
}
function isMoney(s){ return s === '$' || s === 'b$'; }

function buildSheets(){
  var data = current.data;
  var d = computeDerived(data);
  var sheets = [];
  function H(arr){ return arr.map(function(t){ return {v:t, s:'h'}; }); }

  function lineSheet(key, name, widths){
    var cfg = LINE_CONFIG[key];
    var rows = [ H(['Item'].concat(cfg.columns.map(function(c){ return c.label; })).concat(['Subtotal'])) ];
    var n = 0;
    data[key].forEach(function(r){
      if (!rowHasContent(r, cfg.columns)) return;
      n++;
      var line = [n];
      cfg.columns.forEach(function(c){
        var v = r[c.key];
        if (c.type === 'text') line.push(v || '');
        else if (c.type === 'currency') line.push({v:numOrNull(v), s:'$'});
        else line.push(numOrNull(v));
      });
      line.push({v:cfg.computeTotal(r), s:'$'});
      rows.push(line);
    });
    var total = data[key].reduce(function(s, r){ return s + cfg.computeTotal(r); }, 0);
    var totalRow = [];
    for (var i = 0; i < cfg.columns.length; i++) totalRow.push('');
    totalRow.push({v:cfg.totalLabel, s:'b'});
    totalRow.push({v:total, s:'b$'});
    rows.push(totalRow);
    sheets.push({key:key, name:name, widths:widths, rows:rows});
  }

  lineSheet('labor', 'Labor & Scope', [6, 40, 10, 14, 18]);
  lineSheet('materials', 'Materials', [6, 36, 18, 18, 8, 14, 20]);
  lineSheet('subLabor', 'Sub-Labor', [6, 40, 10, 14, 18]);
  lineSheet('misc', 'Misc', [6, 36, 18, 18, 8, 14, 20]);

  /* Final Estimate */
  var m = data.meta, f = data.final, fc = d.final;
  var txf = f.taxable || {};
  function yn(k){ return txf[k] === false ? 'No' : 'Yes'; }
  function money(v){ return {v:v, s:'$'}; }
  function moneyB(v){ return {v:v, s:'b$'}; }
  function catRow(label, cost, pct, marginD, cpm, k){
    return [label, money(cost), numOrNull(pct), money(marginD), money(cpm), yn(k)];
  }
  var fin = [
    [{v:'Client', s:'b'}, m.client || ''],
    [{v:'Date', s:'b'}, m.date || ''],
    [{v:'Scope', s:'b'}, m.scope || ''],
    [],
    H(['Cost Estimate Summary', 'Cost', 'Margin (%)', 'Margin ($)', 'Cost + Margin', 'Taxable']),
    catRow('Labor Total', d.laborTotal, f.marginLabor, fc.labor.marginDollars, fc.labor.costPlusMargin, 'labor'),
    catRow('Material Total', d.materialTotal, f.marginMaterial, fc.material.marginDollars, fc.material.costPlusMargin, 'material'),
    catRow('Sub-Labor Total', d.subLaborTotal, f.marginSubLabor, fc.subLabor.marginDollars, fc.subLabor.costPlusMargin, 'subLabor'),
    catRow('Misc Total', d.miscTotal, f.marginMisc, fc.misc.marginDollars, fc.misc.costPlusMargin, 'misc'),
    [{v:'Subtotal', s:'b'}, moneyB(fc.sumCost), '', moneyB(fc.sumMargin), moneyB(fc.sumCostPlusMargin)],
    ['Warranty', '', numOrNull(f.warrantyPct), '', money(fc.warrantyAmt), yn('warranty')],
    ['Trip Charge', '', '', '', money(fc.tripCharge), yn('trip')],
    ['Freight Cost', '', '', '', money(fc.freightCost), yn('freight')],
    [{v:'Subtotal Cost', s:'b'}, '', '', '', moneyB(fc.subtotalCost)],
    ['Taxable Amount', '', '', '', money(fc.taxableBase)],
    ['Tax', '', numOrNull(f.taxPct), '', money(fc.taxAmt)],
    [{v:'Total Cost', s:'b'}, '', '', '', moneyB(fc.totalCost)]
  ];
  sheets.push({key:'final', name:'Final Estimate', widths:[28, 16, 12, 16, 18, 10], rows:fin});

  /* Billing */
  var b = data.billing, bc = d.billing;
  var bill = [];
  bill.push(H(['Contract summary', 'Contract $', 'Billed to date $', 'Remaining $']));
  function crow(label, contract, remaining, bold){
    var mk = bold ? moneyB : money;
    return [bold ? {v:label, s:'b'} : label, mk(contract), mk(contract - remaining), mk(remaining)];
  }
  bill.push(crow('Labor', bc.contractLabor, bc.remainingLabor));
  bill.push(crow('Materials', bc.contractMaterials, bc.remainingMaterials));
  bill.push(crow('Sub-Contractors', bc.contractSubContr, bc.remainingSubContr));
  bill.push(crow('Misc + Warranty', bc.contractMisc, bc.remainingMisc));
  bill.push(crow('Subtotal', bc.contractSubTotal, bc.remainingSubTotal, true));
  bill.push(crow('Change Order', bc.changeOrderAmount, bc.remainingChange));
  bill.push(crow('Total Contract', bc.totalContract, bc.remainingTotal, true));
  bill.push(['Retainage %', numOrNull(b.retainagePct)]);
  bill.push(['Retainage held to date', money(bc.retainageBilled)]);
  bill.push([]);
  bill.push(H(['#','Invoice Date','Invoice No','Labor %','Labor $','Materials %','Materials $','Sub-Contr %','Sub-Contr $','Misc %','Misc $','Change %','Change $','Subtotal','Retainage','Total','Running Total']));
  var sumSub = 0, sumRet = 0, sumTot = 0;
  b.cycles.forEach(function(c, idx){
    var any = ['date','invoiceNo','laborPct','materialsPct','subContrPct','miscPct','changeOrderPct'].some(function(k){ return String(c[k] || '').trim() !== ''; });
    if (!any) return;
    var cc = bc.cycles[idx];
    sumSub += cc.subTotalAmt; sumRet += cc.retainageAmt; sumTot += cc.totalAmt;
    bill.push([idx + 1, c.date || '', c.invoiceNo || '',
      numOrNull(c.laborPct), money(cc.laborAmt), numOrNull(c.materialsPct), money(cc.materialsAmt),
      numOrNull(c.subContrPct), money(cc.subContrAmt), numOrNull(c.miscPct), money(cc.miscAmt),
      numOrNull(c.changeOrderPct), money(cc.changeAmt),
      money(cc.subTotalAmt), money(cc.retainageAmt), money(cc.totalAmt), money(cc.runningTotal)]);
  });
  bill.push([{v:'Totals', s:'b'}, '', '', '', '', '', '', '', '', '', '', '', '', moneyB(sumSub), moneyB(sumRet), moneyB(sumTot)]);
  sheets.push({key:'billing', name:'Billing', widths:[22, 14, 16, 10, 14, 11, 14, 11, 14, 9, 14, 10, 14, 15, 14, 15, 15], rows:bill});

  /* keep the same order as the tabs */
  var order = {};
  TAB_ORDER.forEach(function(k, i){ order[k] = i; });
  sheets.sort(function(a, b){ return order[a.key] - order[b.key]; });
  return sheets;
}

/* ---- CSV ---- */
function csvEscape(v){
  v = v === undefined || v === null ? '' : String(v);
  if (/[",\r\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
  return v;
}
function csvCell(c){
  var n = cellNorm(c), v = n.v;
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') return isMoney(n.s) ? v.toFixed(2) : String(v);
  v = String(v);
  /* stop spreadsheet apps treating typed text as a formula */
  if (/^[=+@\t\r]/.test(v) || /^-[^\d.]/.test(v)) v = "'" + v;
  return csvEscape(v);
}
function sheetToCsv(sh){

/* ---- minimal ZIP writer (stored, no compression) ---- */
function crc32(bytes){
  var t = crc32.table;
  if (!t){
    t = crc32.table = [];
    for (var n = 0; n < 256; n++){
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
  }
  var crc = 0xFFFFFFFF;
  for (var i = 0; i < bytes.length; i++) crc = t[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files){

    var nameB = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    var lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, nameB.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nameB, f.data);
    var ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
    ch.setUint16(28, nameB.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + size;
  });
  var cdSize = 0;
  central.forEach(function(c){ cdSize += c.length; });
  var end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true); end.setUint16(20, 0, true);
  return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), {type:'application/zip'});
}

   writes the estimate's inputs into its cells and saves it as a
   normal .xlsx. Formatting, tables and formulas stay as they are in
   the template; Excel recalculates everything when the file opens.
   If the template layout ever changes, update TEMPLATE_MAP only.
   ============================================================ */
var TEMPLATE_URL = 'ABAS_Estimator-Template.xltm';
var TEMPLATE_MAP = {
  labor:     {sheet:'Labor & Scope', first:6, last:55, cols:{scope:'B', hours:'C', rate:'D'}, sub:'E',
              totals:{qty:'C57', amt:'E57'}},

              totals:{amt:'G37'}},

              totals:{qty:'C37', amt:'E37'}},
  misc:      {sheet:'Misc', first:6, last:35, cols:{desc:'B', partNumber:'C', vendor:'D', qty:'E', unitCost:'F'}, sub:'G',
              totals:{amt:'G36'}},
  final:     {sheet:'Final Estimate'},

/* ---- minimal ZIP reader (stored + deflate, via the browser's DecompressionStream) ---- */
function inflateRaw(bytes){
  if (typeof DecompressionStream === 'undefined'){
    return Promise.reject(new Error('This browser is too old to open the Excel template. Update it, or use Excel — internal instead.'));
  }
  var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(stream).arrayBuffer().then(function(buf){ return new Uint8Array(buf); });
}
function readZip(buffer){
  var dv = new DataView(buffer), u8 = new Uint8Array(buffer), dec = new TextDecoder();
  var eocd = -1;
  for (var i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) return Promise.reject(new Error('The template is not a valid Excel file.'));
  var count = dv.getUint16(eocd + 10, true), p = dv.getUint32(eocd + 16, true);
  var jobs = [];
  for (var n = 0; n < count; n++){
    if (dv.getUint32(p, true) !== 0x02014b50) return Promise.reject(new Error('The template is damaged.'));
    var method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    var nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);
    var lho = dv.getUint32(p + 42, true);
    var name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
    var start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    var raw = u8.slice(start, start + csize);
    jobs.push((function(name, method, raw){
      if (method === 0) return Promise.resolve({name:name, data:raw});
      if (method === 8) return inflateRaw(raw).then(function(d){ return {name:name, data:d}; });
      return Promise.reject(new Error('Unsupported compression in template: ' + name));
    })(name, method, raw));
    p += 46 + nameLen + extraLen + commentLen;
  }
  return Promise.all(jobs);
}

/* ---- loading the template: from the app's own folder, or picked by the user ---- */
function loadTemplateBuffer(){

/* ---- cell helpers on a parsed worksheet ---- */
function colIndex(ref){

  for (var i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
  return n;
}
function childrenByTag(el, tag){

function getCellEl(doc, ref){

  childrenByTag(sheetData, 'row').some(function(r){
    var rn = parseInt(r.getAttribute('r'), 10);
    if (rn === rowNum){ row = r; return true; }
    if (rn > rowNum){ before = r; return true; }
    return false;
  });
  if (!row){
    row = doc.createElementNS(SS_NS, 'row');
    row.setAttribute('r', String(rowNum));
    sheetData.insertBefore(row, before);
  }
  var cell = null, cBefore = null, ci = colIndex(ref);
  childrenByTag(row, 'c').some(function(c){
    var cr = c.getAttribute('r');
    if (cr === ref){ cell = c; return true; }
    if (colIndex(cr) > ci){ cBefore = c; return true; }
    return false;
  });
  if (!cell){
    cell = doc.createElementNS(SS_NS, 'c');
    cell.setAttribute('r', ref);

function clearCellContent(cell){

}
function addV(doc, cell, v){

}
function cleanNum(v){ return Math.round(v * 1e9) / 1e9; }
/* input cell: number, text, or blank (keeps the cell's template style) */
function setInput(doc, ref, v){
  var cell = getCellEl(doc, ref);

  if (v === null || v === undefined || v === '') return;
  if (typeof v === 'number'){
    if (isFinite(v)) addV(doc, cell, cleanNum(v));
    return;
  }
  cell.setAttribute('t', 'inlineStr');
  var is = doc.createElementNS(SS_NS, 'is'), t = doc.createElementNS(SS_NS, 't');

  childrenByTag(cell, 'v').forEach(function(n){ cell.removeChild(n); });
  cell.removeAttribute('t');
  addV(doc, cell, isFinite(v) ? cleanNum(v) : 0);

/* replace a cell's formula (used for tax, which the app makes configurable) */
function setFormula(doc, ref, formula, cached){

function excelDate(s){

function fillLineSheet(doc, key){

  var rows = filledRows(key), qtyKey = cfg.columns.some(function(c){ return c.key === 'hours'; }) ? 'hours' : 'qty';
  var qtySum = 0, amtSum = 0;
  for (var r = m.first; r <= m.last; r++){

      var ref = m.cols[c.key] + r;
      if (!src) { setInput(doc, ref, null); return; }
      var v = src[c.key];
      setInput(doc, ref, c.type === 'text' ? String(v || '').trim() : numOrNull(v));
    });
    var sub = src ? cfg.computeTotal(src) : 0;
    setCached(doc, m.sub + r, sub);
    amtSum += sub;

function fillFinalSheet(doc, d){
  var data = current.data, f = data.final, fc = d.final, meta = data.meta;
  setInput(doc, 'C5', excelDate(meta.date));
  setInput(doc, 'C6', String(meta.client || '').trim());

  var taxPct = numOrNull(f.taxPct) || 0;

  var tx = f.taxable || {};
  var lines = [['labor','F10'],['material','F11'],['subLabor','F12'],['misc','F13'],['warranty','F14'],['trip','F17'],['freight','F18']];
  var taxed = lines.filter(function(l){ return tx[l[0]] !== false; }).map(function(l){ return l[1]; });

                 : taxed.length ? rate + '*SUM(' + taxed.join(',') + ')' : '0';

function fillBillingSheet(doc, d){

  setInput(doc, 'D4', bc.contractSubContr);
  setInput(doc, 'D5', bc.contractMisc);
  setFormula(doc, 'D6', 'SUM(D2:D5)', bc.contractSubTotal);
  setInput(doc, 'D7', bc.changeOrderAmount);
  setCached(doc, 'D8', bc.totalContract);
  setCached(doc, 'E2', bc.remainingLabor);
  setCached(doc, 'E3', bc.remainingMaterials);
  setCached(doc, 'E4', bc.remainingSubContr);
  setCached(doc, 'E5', bc.remainingMisc);
  setCached(doc, 'E6', bc.remainingSubTotal);
  setCached(doc, 'E7', bc.remainingChange);
  setCached(doc, 'E8', bc.remainingTotal);
  setInput(doc, 'C10', pctFrac(b.retainagePct) || 0);
  setCached(doc, 'D10', bc.retainageBilled);

  var cycles = filledCycles();
  var sums = {D:0,E:0,F:0,G:0,H:0,I:0,J:0,K:0,L:0,M:0,N:0,O:0,P:0};
  var running = 0;
  for (var r = m.cycleFirst; r <= m.cycleLast; r++){
    var c = cycles[r - m.cycleFirst];
    var inp = c ? c.input : {}, k = c ? c.calc : null;
    var vals = {
      D: pctFrac(inp.laborPct), F: pctFrac(inp.materialsPct), H: pctFrac(inp.subContrPct),
      J: pctFrac(inp.miscPct), L: pctFrac(inp.changeOrderPct)
    };
    setInput(doc, 'B' + r, c ? excelDate(inp.date) : null);
    setInput(doc, 'C' + r, c ? textOrNum(inp.invoiceNo) : null);
    Object.keys(vals).forEach(function(col){ setInput(doc, col + r, vals[col]); sums[col] += vals[col] || 0; });
    var calc = {
      E: k ? k.laborAmt : 0, G: k ? k.materialsAmt : 0, I: k ? k.subContrAmt : 0, K: k ? k.miscAmt : 0,
      M: k ? k.changeAmt : 0, N: k ? k.subTotalAmt : 0, O: k ? k.retainageAmt : 0, P: k ? k.totalAmt : 0
    };
    running += calc.P;
    Object.keys(calc).forEach(function(col){ setCached(doc, col + r, calc[col]); sums[col] += calc[col]; });
    setCached(doc, 'Q' + r, running);
  }
  Object.keys(sums).forEach(function(col){ setCached(doc, col + '20', sums[col]); });
}

function buildTemplateXlsx(buffer){
  return readZip(buffer).then(function(entries){
    var enc = new TextEncoder(), dec = new TextDecoder();
    var byName = {};
    entries.forEach(function(e){ byName[e.name] = e; });
    function text(name){ return dec.decode(byName[name].data); }
    function parse(name){ return new DOMParser().parseFromString(text(name), 'application/xml'); }
    function put(name, doc){
      var s = new XMLSerializer().serializeToString(doc);
      if (!/^<\?xml/.test(s)) s = XML_DECL + s;
      byName[name].data = enc.encode(s);
    }
    function drop(name){ delete byName[name]; }

    /* find each sheet's file by its tab name */
    var wb = parse('xl/workbook.xml'), rels = parse('xl/_rels/workbook.xml.rels');
    var relTarget = {};
    Array.prototype.forEach.call(rels.getElementsByTagNameNS(PKG_REL_NS, 'Relationship'), function(r){
      relTarget[r.getAttribute('Id')] = r.getAttribute('Target');
    });
    var sheetPath = {};
    Array.prototype.forEach.call(wb.getElementsByTagNameNS(SS_NS, 'sheet'), function(s){
      var rid = s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      var t = relTarget[rid] || '';
      sheetPath[s.getAttribute('name')] = t.charAt(0) === '/' ? t.slice(1) : 'xl/' + t;
    });
    Object.keys(TEMPLATE_MAP).forEach(function(k){
      var p = sheetPath[TEMPLATE_MAP[k].sheet];
      if (!p || !byName[p]) throw new Error('The template has no "' + TEMPLATE_MAP[k].sheet + '" sheet.');
    });

    var d = computeDerived(current.data);
    ['labor','materials','subLabor','misc'].forEach(function(key){
      var path = sheetPath[TEMPLATE_MAP[key].sheet], doc = parse(path);
      fillLineSheet(doc, key);
      put(path, doc);
    });
    var fp = sheetPath[TEMPLATE_MAP.final.sheet], fdoc = parse(fp);
    fillFinalSheet(fdoc, d); put(fp, fdoc);
    var bp = sheetPath[TEMPLATE_MAP.billing.sheet], bdoc = parse(bp);
    fillBillingSheet(bdoc, d); put(bp, bdoc);

    /* template (.xltm, macro-enabled) -> plain workbook (.xlsx):
       drop the unused macro and the stale calc chain, and have Excel recalc on open */
    var calcPr = wb.getElementsByTagNameNS(SS_NS, 'calcPr')[0];
    if (calcPr) calcPr.setAttribute('fullCalcOnLoad', '1');
    put('xl/workbook.xml', wb);
    Array.prototype.slice.call(rels.getElementsByTagNameNS(PKG_REL_NS, 'Relationship')).forEach(function(r){
      var t = r.getAttribute('Type') || '';
      if (/\/vbaProject$/.test(t) || /\/calcChain$/.test(t)){
        drop('xl/' + r.getAttribute('Target'));
        r.parentNode.removeChild(r);
      }
    });
    put('xl/_rels/workbook.xml.rels', rels);
    var ct = parse('[Content_Types].xml');
    Array.prototype.slice.call(ct.getElementsByTagName('Override')).forEach(function(o){
      var part = o.getAttribute('PartName');
      if (part === '/xl/workbook.xml'){
        o.setAttribute('ContentType', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml');
      } else if (!byName[part.slice(1)]){
        o.parentNode.removeChild(o);
      }
    });
    put('[Content_Types].xml', ct);

    var files = entries.filter(function(e){ return byName[e.name]; }).map(function(e){ return byName[e.name]; });
    return new Blob([makeZip(files)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  });
}

function exportTemplateXLSX(){
  var over = templateOverflow();
  if (over.length){
    alert('This estimate is bigger than the ABAS Excel template:\n\n• ' + over.join('\n• ') +
      '\n\nTrim or combine lines to fit, or use Export → Excel — internal, which has no row limit.');
    return;
  }
  loadTemplateBuffer().then(buildTemplateXlsx).then(function(blob){
    downloadBlob(safeFileName(current.name) + '_ABAS-Estimate.xlsx', blob, blob.type);
  }).catch(function(err){
    if (err && err.message === 'cancelled') return;
    console.error(err);
    alert('Could not build the ABAS Excel file: ' + (err && err.message ? err.message : err));
  });
}

function defaultTaxable(){
  return {labor:true, material:true, subLabor:true, misc:true, warranty:true, trip:true, freight:true};
}
function defaultProposal(){
  return {detail:'category', scope:'', inclusions:'', exclusions:'', terms:'', validDays:30, paymentTerms:'Net 30'};
}
function migrateData(data){
  var def = makeDefaultData();
  Object.keys(def).forEach(function(k){ if (data[k] === undefined || data[k] === null) data[k] = def[k]; });
  var dt = defaultTaxable();
  if (!data.final.taxable) data.final.taxable = dt;
  else Object.keys(dt).forEach(function(k){ if (data.final.taxable[k] === undefined) data.final.taxable[k] = true; });
  var dp = defaultProposal();
  if (!data.proposal) data.proposal = dp;
  else Object.keys(dp).forEach(function(k){ if (data.proposal[k] === undefined) data.proposal[k] = dp[k]; });
  if (!data.billing.cycles || !data.billing.cycles.length) data.billing.cycles = [makeCycleRow()];
  return data;
}

/* ---- client proposal: sell prices only, never cost or margin ---- */
function r2(x){ return Math.round((x + 1e-9) * 100) / 100; }

/* Round each value to cents so the rounded values add up exactly to target. */
function allocateRounded(vals, target){
  var cents = Math.round(target * 100);
  var floors = vals.map(function(v){ return Math.floor(v * 100 + 1e-9); });
  var rem = cents - floors.reduce(function(a, b){ return a + b; }, 0);
  var order = vals.map(function(v, i){ return {i:i, f: v * 100 - floors[i]}; })
                  .sort(function(a, b){ return b.f - a.f; });
  var out = floors.slice(), k = 0;
  while (rem > 0 && order.length){ out[order[k % order.length].i]++; rem--; k++; }
  k = 0;
  while (rem < 0 && order.length){ out[order[order.length - 1 - (k % order.length)].i]--; rem++; k++; }
  return out.map(function(c){ return c / 100; });
}

function parseYMD(s){
  var p = String(s || '').split('-');
  if (p.length !== 3) return null;
  var dt = new Date(+p[0], +p[1] - 1, +p[2]);
  return isNaN(dt.getTime()) ? null : dt;
}
function longDate(dt){
  return dt.toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
}

function buildProposalHtml(){
  var data = current.data, P = data.proposal || defaultProposal(), M = data.meta;
  var d = computeDerived(data), fc = d.final;
  var detail = (P.detail === 'lump' || P.detail === 'itemized') ? P.detail : 'category';
  var co = company;

  var cats = [
    {key:'labor',     label:'Labor',          sell:fc.labor.costPlusMargin,    cost:fc.labor.cost,    unit:' hrs'},
    {key:'materials', label:'Materials',      sell:fc.material.costPlusMargin, cost:fc.material.cost, unit:''},
    {key:'subLabor',  label:'Subcontractors', sell:fc.subLabor.costPlusMargin, cost:fc.subLabor.cost, unit:' hrs'},
    {key:'misc',      label:'Miscellaneous',  sell:fc.misc.costPlusMargin,     cost:fc.misc.cost,     unit:''}
  ];
  var extras = [
    {label:'Warranty',    v:fc.warrantyAmt},
    {label:'Trip charge', v:fc.tripCharge},
    {label:'Freight',     v:fc.freightCost}
  ];

  /* cents that add up exactly to the Final Estimate figures */
  var subtotal = r2(fc.subtotalCost);
  var total = r2(fc.totalCost);
  var tax = r2(total - subtotal);
  var alloc = allocateRounded(cats.map(function(c){ return c.sell; }).concat(extras.map(function(e){ return e.v; })), subtotal);
  cats.forEach(function(c, i){ c.amt = alloc[i]; });
  extras.forEach(function(e, i){ e.amt = alloc[cats.length + i]; });

  var itemized = detail === 'itemized';
  var span = itemized ? 3 : 2;
  function tr(label, qty, amt, cls){
    return '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + label + '</td>' +
      (itemized ? '<td class="q">' + qty + '</td>' : '') + '<td class="a">' + fmtCurrency(amt) + '</td></tr>';
  }

  function itemLines(c){
    var cfg = LINE_CONFIG[c.key];
    var factor = c.cost > 0 ? c.sell / c.cost : 1;
    var isLabor = cfg.columns[0].key === 'scope';
    var items = [];
    (data[c.key] || []).forEach(function(r){
      var exact = cfg.computeTotal(r);
      if (!(exact > 0)) return;                 /* skips seeded labels with nothing entered */
      var desc = isLabor ? (r.scope || c.label) : ((r.desc || 'Item') + (r.partNumber ? ' (' + r.partNumber + ')' : ''));
      var q = parseFloat(isLabor ? r.hours : r.qty);
      items.push({desc: desc, qty: isFinite(q) ? fmtNum(q) + c.unit : '', exact: exact * factor});
    });
    var amts = allocateRounded(items.map(function(it){ return it.exact; }), c.amt);
    items.forEach(function(it, i){ it.amt = amts[i]; });
    return items;
  }

  var rows = '';
  if (detail === 'lump'){
    rows += tr('Complete scope of work as described', '', subtotal);
  } else {
    cats.forEach(function(c){
      if (!(c.amt > 0)) return;
      if (itemized){
        var items = itemLines(c);
        rows += '<tr class="grp"><td colspan="3">' + esc(c.label) + '</td></tr>';
        items.forEach(function(it){ rows += tr(esc(it.desc), esc(it.qty), it.amt); });
        if (items.length > 1) rows += tr(esc(c.label) + ' subtotal', '', c.amt, 'sub');
      } else {
        rows += tr(esc(c.label), '', c.amt);
      }
    });
    if (itemized && extras.some(function(e){ return e.amt > 0; })) rows += '<tr class="grp"><td colspan="3">Other charges</td></tr>';
    extras.forEach(function(e){ if (e.amt > 0) rows += tr(esc(e.label), '', e.amt); });
  }
  if (tax !== 0){
    var tx = data.final.taxable || {};
    var partial = Object.keys(tx).some(function(k){ return tx[k] === false; });
    if (detail !== 'lump') rows += tr('Subtotal', '', subtotal, 'sub');
    rows += tr('Sales tax (' + fmtNum(parseFloat(data.final.taxPct) || 0) + '%' + (partial ? ' on taxable items' : '') + ')', '', tax);
  }
  rows += tr('Total', '', total, 'tot');

  var table = '<table><thead><tr><th>Description</th>' + (itemized ? '<th class="a">Qty</th>' : '') + '<th class="a">Amount</th></tr></thead><tbody>' + rows + '</tbody></table>';

  /* header + meta */
  var dateObj = parseYMD(M.date);
  var days = parseInt(P.validDays, 10);
  var validUntil = '';
  if (dateObj && days > 0){ var vu = new Date(dateObj.getTime()); vu.setDate(vu.getDate() + days); validUntil = longDate(vu); }
  var html = '<div class="prop">' +
    '<div class="prop-head"><div>' +
      (co.name ? '<div class="prop-co">' + esc(co.name) + '</div>' : '') +
      (co.address ? '<div class="prop-sub">' + esc(co.address) + '</div>' : '') +
      (co.contact ? '<div class="prop-sub">' + esc(co.contact) + '</div>' : '') +
    '</div><div class="prop-title"><div class="prop-h">PROPOSAL</div>' + (dateObj ? '<div>' + esc(longDate(dateObj)) + '</div>' : '') + '</div></div>' +
    '<div class="prop-meta">' +
      '<div><span>Prepared for</span><b>' + (M.client ? esc(M.client) : '&nbsp;') + '</b></div>' +
      '<div><span>Project</span><b>' + esc(current.name || 'Untitled Estimate') + '</b></div>' +
      (co.preparedBy ? '<div><span>Prepared by</span><b>' + esc(co.preparedBy) + '</b></div>' : '') +
      (validUntil ? '<div><span>Valid until</span><b>' + esc(validUntil) + '</b></div>' : '') +
    '</div>';

  var scopeText = (P.scope || '').trim() || (M.scope || '').trim();
  if (scopeText) html += '<h3>Scope of Work</h3><p class="pre">' + esc(scopeText) + '</p>';
  html += '<h3>Pricing</h3>' + table;
  if ((P.inclusions || '').trim()) html += '<h3>Inclusions</h3><p class="pre">' + esc(P.inclusions.trim()) + '</p>';
  if ((P.exclusions || '').trim()) html += '<h3>Exclusions</h3><p class="pre">' + esc(P.exclusions.trim()) + '</p>';

  var terms = [];
  if ((P.paymentTerms || '').trim()) terms.push('Payment terms: ' + P.paymentTerms.trim());
  if (days > 0) terms.push('This proposal is valid for ' + days + ' days' + (dateObj ? ' from the date above' : ' from the date of issue') + '.');
  if ((P.terms || '').trim()) terms.push(P.terms.trim());
  if (terms.length) html += '<h3>Terms</h3><p class="pre">' + esc(terms.join('\n\n')) + '</p>';

  html += '<div class="sigs">' +
    '<div><h3>Accepted by (client)</h3><div class="sig-line"></div><div class="sig-lab">Signature</div><div class="sig-line"></div><div class="sig-lab">Printed name, title and date</div></div>' +
    '<div><h3>' + (co.name ? 'For ' + esc(co.name) : 'For the contractor') + '</h3><div class="sig-line"></div><div class="sig-lab">Signature</div><div class="sig-line"></div><div class="sig-lab">Printed name, title and date</div></div>' +
    '</div></div>';
  return html;
}

    '<label>Pricing detail</label><select data-role="proposal-field" data-key="detail">' + opt('lump', 'Lump sum only') + opt('category', 'By category') + opt('itemized', 'Itemized (at sell price)') + '</select>'+
    pf('scope', 'Scope of work', 'Describe the work being proposed. If left blank, the scope summary from the Final Estimate tab is used.', 5)+
    pf('inclusions', 'Inclusions', 'What is included', 3)+
    pf('exclusions', 'Exclusions', 'What is not included', 3)+
    pf('terms', 'Other terms', 'Warranty, schedule, change orders, etc.', 3)+
    '<label>Valid for (days)</label><input type="number" min="0" step="1" value="' + esc(P.validDays) + '" data-role="proposal-field" data-key="validDays">'+
    '<label>Payment terms</label><input type="text" value="' + esc(P.paymentTerms) + '" data-role="proposal-field" data-key="paymentTerms" placeholder="e.g. Net 30">'+
  '</div>'+
  '<div class="table-toolbar"><button class="btn btn-primary" data-action="print-proposal">Print / save as PDF</button></div>'+
  '<div class="preview-label">Preview</div>'+
  '<div id="proposalPreview" class="prop-screen">' + buildProposalHtml() + '</div>';
}

/* ---- internal report (all sheets, cost and margin) + printing ---- */
function buildReportHtml(){
  var html = '<div class="rpt"><div class="internal-banner">INTERNAL ESTIMATE &mdash; shows cost and margin. Not for client distribution.</div><h1>' + esc(current.name) + '</h1>';
  buildSheets().forEach(function(sh){
    html += '<h2>' + esc(sh.name) + '</h2><table>';
    sh.rows.forEach(function(r){
      if (!r.length){ html += '<tr><td class="sp">&nbsp;</td></tr>'; return; }
      html += '<tr>' + r.map(function(c){
        var n = cellNorm(c), v = n.v, cls = [];
        var txt;
        if (v === null || v === undefined || v === '') txt = '';
        else if (typeof v === 'number'){ txt = isMoney(n.s) ? fmtCurrency(v) : fmtNum(v, 2); cls.push('num'); }
        else txt = esc(v);
        if (n.s === 'b' || n.s === 'b$') cls.push('b');
        var tag = n.s === 'h' ? 'th' : 'td';
        return '<' + tag + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + '>' + txt + '</' + tag + '>';
      }).join('') + '</tr>';
    });
    html += '</table>';
  });
  return html + '</div>';
}
function printReport(){
  var el = document.getElementById('printReport');
  if (!el) return;
  var mode = printMode || (activeTab === 'proposal' ? 'proposal' : 'internal');
  el.innerHTML = mode === 'proposal' ? buildProposalHtml() : buildReportHtml();
}
window.addEventListener('beforeprint', printReport);
window.addEventListener('afterprint', function(){ printMode = null; });

function runExport(kind){
  if (kind === 'xlsx-template') exportTemplateXLSX();
  else if (kind === 'xlsx') exportXLSX();
  else if (kind === 'proposal'){ printMode = 'proposal'; printReport(); window.print(); }
  else if (kind === 'pdf'){ printMode = 'internal'; printReport(); window.print(); }
  else if (kind === 'csv-zip') exportCSVZip();
  else if (kind === 'json') exportProjectJSON();
}
